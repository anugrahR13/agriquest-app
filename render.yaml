services:
  - type: web
    name: agriquest
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: agriquest
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_VISION_ENABLED
        value: "true"
      - key: AI_IMPLEMENTATION
        value: "google-vision"
      - key: DATABASE_URL
        fromDatabase:
          name: agriquest-db
          property: connectionString

databases:
  - name: agriquest-db
    databaseName: agriquest
    user: agriquest
    plan: free