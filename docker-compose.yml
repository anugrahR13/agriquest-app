version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agriquest-db
    environment:
      POSTGRES_DB: agriquest_db
      POSTGRES_USER: agriquest_user
      POSTGRES_PASSWORD: agriquest_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriquest_user -d agriquest_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: