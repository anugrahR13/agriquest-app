<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#E0F7FA" />
    </linearGradient>
    <linearGradient id="fieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB342" />
      <stop offset="100%" stop-color="#558B2F" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1200" height="500" fill="url(#skyGradient)" />
  
  <!-- Sun -->
  <circle cx="900" cy="150" r="80" fill="url(#sunGradient)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Distant mountains -->
  <path d="M0,320 Q300,100 600,280 T1200,250 V500 H0 Z" fill="#78909C" opacity="0.7" />
  
  <!-- Fields -->
  <path d="M0,500 Q300,450 600,480 T1200,460 V800 H0 Z" fill="url(#fieldGradient)" />
  
  <!-- Crop rows -->
  <g opacity="0.8">
    <path d="M100,550 Q300,530 500,550 T900,540 T1200,550 V800 H100 Z" fill="#8BC34A" />
    <path d="M0,600 Q200,580 400,600 T800,590 T1200,600 V800 H0 Z" fill="#7CB342" />
    <path d="M50,650 Q250,630 450,650 T850,640 T1200,650 V800 H50 Z" fill="#689F38" />
    <path d="M150,700 Q350,680 550,700 T950,690 T1200,700 V800 H150 Z" fill="#558B2F" />
  </g>
  
  <!-- Trees -->
  <g transform="translate(200, 400) scale(0.8)">
    <path d="M0,0 L20,0 L10,-50 Z" fill="#33691E" />
    <path d="M5,-40 L25,-40 L15,-80 Z" fill="#33691E" />
    <path d="M10,-70 L30,-70 L20,-110 Z" fill="#33691E" />
    <rect x="8" y="0" width="4" height="20" fill="#5D4037" />
  </g>
  
  <g transform="translate(900, 380) scale(1)">
    <path d="M0,0 L30,0 L15,-70 Z" fill="#33691E" />
    <path d="M5,-60 L35,-60 L20,-120 Z" fill="#33691E" />
    <path d="M10,-100 L40,-100 L25,-160 Z" fill="#33691E" />
    <rect x="12" y="0" width="6" height="30" fill="#5D4037" />
  </g>
  
  <!-- Small plants -->
  <g>
    <g transform="translate(300, 580)">
      <path d="M0,0 C5,-10 10,-5 15,-15 C20,-5 25,-10 30,0 Z" fill="#689F38" />
      <path d="M15,0 L15,10" stroke="#558B2F" stroke-width="2" />
    </g>
    <g transform="translate(400, 600)">
      <path d="M0,0 C5,-10 10,-5 15,-15 C20,-5 25,-10 30,0 Z" fill="#689F38" />
      <path d="M15,0 L15,10" stroke="#558B2F" stroke-width="2" />
    </g>
    <g transform="translate(500, 590)">
      <path d="M0,0 C5,-10 10,-5 15,-15 C20,-5 25,-10 30,0 Z" fill="#689F38" />
      <path d="M15,0 L15,10" stroke="#558B2F" stroke-width="2" />
    </g>
    <g transform="translate(600, 610)">
      <path d="M0,0 C5,-10 10,-5 15,-15 C20,-5 25,-10 30,0 Z" fill="#689F38" />
      <path d="M15,0 L15,10" stroke="#558B2F" stroke-width="2" />
    </g>
    <g transform="translate(700, 600)">
      <path d="M0,0 C5,-10 10,-5 15,-15 C20,-5 25,-10 30,0 Z" fill="#689F38" />
      <path d="M15,0 L15,10" stroke="#558B2F" stroke-width="2" />
    </g>
    <g transform="translate(800, 590)">
      <path d="M0,0 C5,-10 10,-5 15,-15 C20,-5 25,-10 30,0 Z" fill="#689F38" />
      <path d="M15,0 L15,10" stroke="#558B2F" stroke-width="2" />
    </g>
  </g>
  
  <!-- Clouds -->
  <g opacity="0.9">
    <g transform="translate(100, 150)">
      <ellipse cx="0" cy="0" rx="40" ry="30" fill="white" />
      <ellipse cx="30" cy="-10" rx="50" ry="35" fill="white" />
      <ellipse cx="70" cy="0" rx="40" ry="30" fill="white" />
      <animate attributeName="transform" type="translate" from="100,150" to="150,150" dur="30s" repeatCount="indefinite" />
    </g>
    <g transform="translate(600, 100)">
      <ellipse cx="0" cy="0" rx="50" ry="30" fill="white" />
      <ellipse cx="40" cy="-15" rx="60" ry="35" fill="white" />
      <ellipse cx="90" cy="0" rx="50" ry="30" fill="white" />
      <animate attributeName="transform" type="translate" from="600,100" to="650,100" dur="40s" repeatCount="indefinite" />
    </g>
  </g>
  
  <!-- Farm house in distance -->
  <g transform="translate(750, 450) scale(0.5)">
    <rect x="0" y="0" width="100" height="70" fill="#D7CCC8" />
    <polygon points="0,0 100,0 50,-50" fill="#A1887F" />
    <rect x="40" y="30" width="20" height="40" fill="#5D4037" />
    <rect x="10" y="15" width="15" height="15" fill="#90A4AE" />
    <rect x="75" y="15" width="15" height="15" fill="#90A4AE" />
  </g>
  
  <!-- Tractor in distance -->
  <g transform="translate(300, 520) scale(0.3)">
    <rect x="0" y="0" width="120" height="40" fill="#F44336" />
    <rect x="80" y="-30" width="60" height="30" fill="#F44336" />
    <circle cx="20" cy="40" r="20" fill="#424242" />
    <circle cx="100" cy="40" r="30" fill="#424242" />
  </g>
</svg>